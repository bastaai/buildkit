name: basta-buildkitd

on:
  workflow_dispatch:
  push:
    tags:
      - 'basta-buildkitd-*'

permissions:
  contents: read
  packages: write

concurrency:
  group: basta-buildkitd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/bastaai/buildkitd
      TAG: v0.8.18-b0385986-fix7268
    steps:
      - uses: actions/checkout@v4

      - id: sha
        run: echo "short=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 needs no QEMU: Go cross-compiles and the final stage only copies the binary.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: basta/Dockerfile
          platforms: linux/arm64,linux/amd64
          build-args: REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:${{ env.TAG }}-${{ steps.sha.outputs.short }}
          push: true
          provenance: false
